[project]
name = "ai-service"
version = "0.2.0"
description = "AI Document Extractor — DeepSeek OCR2 Local Engine"
readme = "README.md"
requires-python = ">=3.12,<3.14"

dependencies = [
    # Web framework
    "fastapi>=0.136.1",
    "uvicorn>=0.46.0",
    "python-multipart>=0.0.28",

    # PDF Processing
    "pymupdf>=1.27.2.3",
    "pdfplumber>=0.11.9",

    # Image processing
    "pillow==10.4.0",

    # DeepSeek OCR2 — Local OCR Engine (GPU-first, CPU fallback)
    "easyocr>=1.7.2",
    "psutil>=6.0.0",

    # AI (optional: Gemini for markdown formatting & QA)
    "google-generativeai>=0.8.6",

    # Embedding (sentence-transformers fallback)
    "torch>=2.3.0",
    "transformers>=4.56.1,<5.0.0",
    "sentence-transformers>=3.0.1,<4.0.0",
    "tokenizers>=0.21.0,<1.0.0",
    "sentencepiece>=0.2.1",

    # Utilities
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "numpy>=1.24.0",

    # Infrastructure
    "pika>=1.4.0",
    "asyncpg>=0.31.0",
]
